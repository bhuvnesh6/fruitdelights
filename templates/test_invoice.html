{% extends "base.html" %}

{% block title %}Test Invoice Email{% endblock %}

{% block content %}

<div class="invoice-test-wrapper">

    <div class="invoice-card">

        <div class="invoice-header">
            <div>
                <p class="eyebrow">EMAIL TESTING</p>
                <h1>Send Mock Invoice</h1>
                <p class="subtitle">
                    Send a beautiful billing email using Resend.
                </p>
            </div>

            <div class="header-badge">
                Billing System
            </div>
        </div>

        <form method="POST" class="invoice-form">

            <div class="form-group">
                <label>Customer Name</label>

                <input
                    type="text"
                    name="name"
                    placeholder="Enter customer name"
                    required
                >
            </div>

            <div class="form-group">
                <label>Email Address</label>

                <input
                    type="email"
                    name="email"
                    placeholder="customer@example.com"
                    required
                >
            </div>

            <button type="submit" class="send-btn">
                Send Mock Invoice
            </button>

        </form>

    </div>

</div>

<style>

.invoice-test-wrapper{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:3rem 1rem;
}

.invoice-card{
    width:100%;
    max-width:680px;

    background:var(--bg-2);

    border:1px solid var(--border);

    border-radius:24px;

    padding:2.5rem;

    box-shadow:var(--shadow-lg);

    position:relative;

    overflow:hidden;
}

.invoice-card::before{
    content:"";

    position:absolute;

    top:-120px;
    right:-120px;

    width:240px;
    height:240px;

    background:var(--accent-soft);

    border-radius:999px;

    opacity:.8;
}

.invoice-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;

    gap:1rem;

    margin-bottom:2.5rem;

    position:relative;
    z-index:2;
}

.eyebrow{
    font-size:.75rem;

    font-weight:700;

    letter-spacing:.12em;

    color:var(--accent);

    margin-bottom:.75rem;
}

.invoice-header h1{
    font-family:var(--font-disp);

    font-size:2.4rem;

    color:var(--text);

    margin-bottom:.75rem;
}

.subtitle{
    color:var(--text-2);

    max-width:420px;

    line-height:1.7;
}

.header-badge{
    background:var(--accent-soft);

    color:var(--accent);

    padding:.75rem 1rem;

    border-radius:999px;

    font-size:.85rem;

    font-weight:700;

    white-space:nowrap;
}

.invoice-form{
    display:flex;
    flex-direction:column;

    gap:1.5rem;

    position:relative;
    z-index:2;
}

.form-group{
    display:flex;
    flex-direction:column;

    gap:.7rem;
}

.form-group label{
    font-size:.95rem;

    font-weight:700;

    color:var(--text);
}

.form-group input{
    width:100%;

    height:56px;

    border:1px solid var(--border);

    border-radius:14px;

    background:var(--bg);

    padding:0 1rem;

    font-size:1rem;

    color:var(--text);

    transition:var(--transition);

    outline:none;
}

.form-group input:focus{
    border-color:var(--accent);

    box-shadow:0 0 0 4px var(--accent-glow);

    background:#fff;
}

.send-btn{
    height:58px;

    border:none;

    border-radius:16px;

    background:var(--accent);

    color:#fff;

    font-size:1rem;

    font-weight:700;

    cursor:pointer;

    transition:var(--transition);

    margin-top:.5rem;

    box-shadow:var(--shadow-md);
}

.send-btn:hover{
    background:var(--accent-hover);

    transform:translateY(-2px);
}

@media(max-width:768px){

    .invoice-card{
        padding:1.5rem;
    }

    .invoice-header{
        flex-direction:column;
    }

    .invoice-header h1{
        font-size:2rem;
    }

}

</style>

{% endblock %}
